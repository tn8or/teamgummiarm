server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    access_log  /dev/stdout json_combined;
    error_log   /dev/stderr warn;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /_nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny  all;
    }
}
