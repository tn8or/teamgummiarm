# Markdown for agents: a client that asks for text/markdown (and doesn't
# rule it out with q=0) gets the page's index.md instead of index.html.
map $http_accept $wants_markdown {
    default                                              0;
    "~*text/markdown(?!\s*;\s*q\s*=\s*0(\.0*)?\s*(,|$))"  1;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    access_log  /dev/stdout json_combined;
    error_log   /dev/stderr warn;

    # The same URL has an HTML and a Markdown representation.
    add_header Vary Accept always;

    location / {
        error_page 418 = @markdown;
        if ($wants_markdown) {
            return 418;
        }
        try_files $uri $uri/ =404;
    }

    # Falls back to the HTML (or the asset itself) when a URL has no
    # Markdown version.
    location @markdown {
        try_files $uri/index.md $uri $uri/index.html =404;
    }

    location = /_nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny  all;
    }
}
