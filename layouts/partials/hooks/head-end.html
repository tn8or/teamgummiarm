{{- /* Hugo's opengraph template doesn't emit the image size. */ -}}
{{- with partial "_funcs/get-page-images" . }}{{ with (index . 0).Image }}
<meta property="og:image:width" content="{{ .Width }}">
<meta property="og:image:height" content="{{ .Height }}">
{{- end }}{{ end }}
{{- if site.Params.staging }}
<meta name="robots" content="noindex, nofollow">
{{- end }}
