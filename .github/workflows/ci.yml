name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # labeled: adding the `staging` label deploys the PR to staging.
    types: [opened, synchronize, reopened, labeled]
  # Morning build of main, so posts go live on their `date` (buildFuture is
  # off). Cron is UTC: 06:00 UTC is 08:00 in summer, 07:00 UTC is 08:00 in
  # winter; the gate below runs only the one that is 08:00 in Copenhagen.
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR builds cancel each other; a main build always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: teamgummiarm
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Run only the schedule that is 08:00 Europe/Copenhagen
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = schedule ]; then
            # Summer (CEST, +0200): 06:00 UTC. Winter (CET, +0100): 07:00 UTC.
            # Picked by cron entry, not by the clock, so a delayed run still counts.
            case "$(TZ=Europe/Copenhagen date +%z)" in
              +0200) want="0 6 * * *" ;;
              *) want="0 7 * * *" ;;
            esac
            if [ "${{ github.event.schedule }}" != "$want" ]; then
              echo "Cron '${{ github.event.schedule }}' isn't 08:00 Copenhagen today ('$want' is): skipping."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: teamgummiarm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Lint post front matter
        run: python scripts/lint-front-matter.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build site
        run: hugo --minify

      # main (push, morning schedule, manual run) pushes :latest (production).
      # PRs from this repo with the `staging` label push :staging.
      - name: Decide what to push
        id: target
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            # Only main goes to production, also for a manual run on another branch.
            if [ "${{ github.ref }}" = refs/heads/main ]; then
              echo tag=latest >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'staging') }}" = true ]; then
            echo tag=staging >> "$GITHUB_OUTPUT"
          fi
          # PR builds are always staging builds, pushed or not.
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo staging_url=https://staging.teamgummiarm.dk/ >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.target.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: teamgummiarm:ci
          build-args: |
            STAGING_URL=${{ steps.target.outputs.staging_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -eu
          name="smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --name "$name" teamgummiarm:ci
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null' EXIT
          for i in $(seq 1 20); do
            docker exec "$name" curl -fsS -o /dev/null http://127.0.0.1/ && break
            sleep 1
          done
          echo "GET / ..."
          docker exec "$name" curl -fsS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1/
          echo "GET missing page returns 404 ..."
          code=$(docker exec "$name" curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/ci-smoke-missing)
          test "$code" = 404
          echo "GET .md is served inline as UTF-8 markdown ..."
          docker exec "$name" sh -c 'printf "# smoke \342\200\223 test\n" > /usr/share/nginx/html/ci-smoke.md'
          ctype=$(docker exec "$name" curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1/ci-smoke.md)
          echo "$ctype"
          test "$ctype" = "text/markdown; charset=utf-8"
          echo "Content negotiation: HTML by default, Markdown on Accept: text/markdown ..."
          check() { # path, Accept header, expected content type
            out=$(docker exec "$name" curl -fsS -D - -o /tmp/body -H "Accept: $2" "http://127.0.0.1$1")
            echo "$1 [$2] -> $(echo "$out" | grep -i '^content-type:' | tr -d '\r')"
            echo "$out" | grep -qi "^content-type: $3"
            echo "$out" | grep -qi '^vary: .*accept'
            echo "$out" | grep -qi '^cache-control: private'
          }
          browser='text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          for path in / /about/ /posts/; do
            check "$path" "$browser" "text/html"
            check "$path" "*/*" "text/html"
            check "$path" "text/markdown" "text/markdown; charset=utf-8"
            docker exec "$name" head -n 1 /tmp/body | grep -q '^# '
            check "$path" "text/markdown, text/html;q=0.9" "text/markdown"
            check "$path" "text/markdown;q=0, text/html" "text/html"
          done
          echo "GET /robots.txt is 200 text/plain with content signals and a sitemap ..."
          out=$(docker exec "$name" curl -fsS -w '\n%{http_code} %{content_type}' http://127.0.0.1/robots.txt)
          echo "$out"
          echo "$out" | tail -n1 | grep -q '^200 text/plain'
          echo "$out" | grep -q '^User-agent: \*$'
          echo "$out" | grep -q '^Content-Signal: search=yes, ai-input=yes, ai-train=yes$'
          echo "$out" | grep -q '^Sitemap: https://.*/sitemap\.xml$'
          if [ -n "${{ steps.target.outputs.staging_url }}" ]; then
            echo "Staging build is not indexable ..."
            echo "$out" | grep -q '^Disallow: /$'
            docker exec "$name" curl -fsS http://127.0.0.1/ | grep -Eq '<meta name="?robots"? content="noindex'
          else
            echo "Production build is indexable ..."
            echo "$out" | grep -q '^Allow: /$'
            if docker exec "$name" curl -fsS http://127.0.0.1/ | grep -q noindex; then
              echo "Production page has noindex"; exit 1
            fi
          fi

      # Same inputs as above, so this reuses the cached build.
      - name: Push container
        if: steps.target.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            STAGING_URL=${{ steps.target.outputs.staging_url }}
          tags: ghcr.io/tn8or/teamgummiarm:${{ steps.target.outputs.tag }}
          cache-from: type=gha
