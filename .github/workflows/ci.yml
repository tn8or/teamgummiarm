name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Morning build of main, so posts go live on their `date` (buildFuture is
  # off). Cron is UTC: 06:00 UTC is 08:00 Copenhagen in summer, 07:00 in winter.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR builds cancel each other; a main build always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STAGING_URL: https://staging.teamgummiarm.dk/
  WRANGLER_VERSION: "4.159.0"

jobs:
  # Lint, build and smoke-test every event. No secrets: PR code (agents open
  # PRs from this repo) never runs next to the Cloudflare token.
  build:
    runs-on: teamgummiarm
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      deploy: ${{ steps.target.outputs.deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
          # Scheduled and manual runs build the branch tip as of checkout, not
          # the commit they were queued with: a run that waited behind a merge
          # must not redeploy the older commit over it.
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref || '' }}

      - name: Resolve the commit being built
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          check-latest: true

      - name: Lint post front matter
        run: python scripts/lint-front-matter.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.169.0"
          extended: true

      # A build of main deploys production and refreshes staging with a build
      # of main that includes future-dated posts, to preview merged posts
      # before their date. A manual run on another branch deploys that branch
      # to staging. PRs are staging builds that deploy nothing: cloud agents
      # push and open PRs as the repo owner, so neither the PR author nor the
      # actor tells an agent's PR from Tommy's.
      - name: Decide what to build and deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "variants=staging" >> "$GITHUB_OUTPUT"
          elif [ "$REF" = refs/heads/main ]; then
            echo "variants=production staging" >> "$GITHUB_OUTPUT"
            echo deploy=main >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "variants=staging" >> "$GITHUB_OUTPUT"
            echo deploy=branch >> "$GITHUB_OUTPUT"
          else
            echo "variants=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        env:
          HUGO_PARAMS_commit: ${{ steps.commit.outputs.sha }}
          VARIANTS: ${{ steps.target.outputs.variants }}
        run: |
          for variant in $VARIANTS; do
            if [ "$variant" = staging ]; then
              HUGO_PARAMS_staging=true hugo --minify --baseURL "$STAGING_URL" --buildFuture --destination "out/$variant"
            else
              hugo --minify --destination "out/$variant"
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install wrangler
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/wrangler" "wrangler@$WRANGLER_VERSION"
          echo "$RUNNER_TEMP/wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Smoke test through the Worker (wrangler dev)
        env:
          VARIANTS: ${{ steps.target.outputs.variants }}
        run: |
          for variant in $VARIANTS; do
            rm -rf public && cp -r "out/$variant" public
            scripts/smoke-test.sh "$variant"
          done

      - name: Upload the tested build
        if: steps.target.outputs.deploy != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/
          retention-days: 7
          if-no-files-found: error

  # Both environments hold CLOUDFLARE_API_TOKEN. `cloudflare` only allows
  # main; `cloudflare-staging` allows any branch but needs Tommy's approval,
  # so a workflow changed in a PR can't reach the token unattended.
  deploy:
    needs: build
    if: needs.build.outputs.deploy != ''
    runs-on: teamgummiarm
    environment: ${{ needs.build.outputs.deploy == 'main' && 'cloudflare' || 'cloudflare-staging' }}
    permissions:
      contents: read

    steps:
      - name: Checkout the commit that was built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Download the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out/

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install wrangler
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/wrangler" "wrangler@$WRANGLER_VERSION"
          echo "$RUNNER_TEMP/wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Deploy production
        if: needs.build.outputs.deploy == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          rm -rf public && mv out/production public
          wrangler deploy --message "$SHA"

      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          rm -rf public && mv out/staging public
          wrangler deploy --env staging --message "$SHA"
