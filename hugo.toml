baseURL = 'https://teamgummiarm.dk/'
locale = 'da'
title = 'Team Gummiarm Racing #393'
theme = 'bilberry-hugo-theme'
defaultContentLanguage = 'da'
enableRobotsTXT = true
# Posts go live on their `date`: future-dated posts are left out until a build
# on or after that date (the scheduled morning build in ci.yml). A bare
# date = 'YYYY-MM-DD' is midnight in this time zone.
buildFuture = false
timeZone = 'Europe/Copenhagen'

[params]
  # Fallback og:image/twitter:image for pages without a bundle image
  # (layouts/partials/_funcs/get-page-images.html).
  images = ["images/avatar.png"]
  description = "Team Gummiarm #393: Tommy Eriksen og en Aprilia RSV Mille fra 1999 i Classic Superbike Hyggerace på danske og svenske baner."
  author = { name = "Tommy Eriksen", email = "r@teamgummiarm.dk" }
  keywords ="team gummiarm,classic superbike,hyggerace,aprilia rsv mille"

  # Posts per page on the front page (newest first)
  paginate = 7

  subtitle = "Classic Superbike Hyggerace · Aprilia RSV Mille #393"
  customImage = "/images/avatar.png"
  overlayIcon = "fa-home"

  # No moment.js (WEBS-31): it was ~530 KB of the theme JS and only printed
  # the post date. layouts/partials/default-content.html formats it with
  # time.Format in the site locale instead ("10. november 2026").
  enableMomentJs = false
  dateFormat = "2. January 2006"
  # No code blocks on the site: load the theme JS build without highlight.js
  # (about half the size; WEBS-30).
  enableHighlightJs = false
  showFooter = true
  amountLatestPostsInFooter = 5
  amountCategoriesInFooter = -1
  showArchive = false
  showSocialMedia = true
  socialMediaLinks = [
    { link = "https://instagram.com/teamgummiarm", icon = "fab fa-instagram", rel = "me" },
    { link = "https://facebook.com/teamgummiarm", icon = "fab fa-facebook", rel = "me" },
    { link = "https://youtube.com/@teamgummiarm", icon = "fab fa-youtube", rel = "me" },
    { link = "mailto:r@teamgummiarm.dk", icon = "fas fa-envelope" },
  ]
  copyrightBy = "Tommy Eriksen"
  copyrightUseCurrentYear = false
  copyrightYearOverride = "2026"
  copyrightUrl = "https://teamgummiarm.dk"
  creditsText = "Bilberry Hugo Theme"
  creditsUrl = "https://github.com/Lednerb/bilberry-hugo-theme"

# Only tags are used; the others only produced empty pages in the sitemap.
[taxonomies]
  tag = "tags"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Markdown copy of every page (index.md next to index.html). nginx serves it
# instead of the HTML when a client sends Accept: text/markdown.
[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["html", "rss", "markdown"]
  section = ["html", "rss", "markdown"]
  page = ["html", "markdown"]

# Expose the avatar to Hugo's image pipeline so the fallback og:image
# (params.images) is served resized. Declaring an assets mount drops the
# default one, so assets/ is mounted explicitly too.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static/images/avatar.png"
  target = "assets/images/avatar.png"
# The theme's prebuilt CSS and JS, fingerprinted by the layouts so they can be
# cached: CSS rewritten by layouts/partials/_funcs/theme-css.html (WEBS-30),
# JS picked in layouts/_default/baseof.html (WEBS-31).
[[module.mounts]]
  source = "themes/bilberry-hugo-theme/static/theme.css"
  target = "assets/bilberry/theme.css"
[[module.mounts]]
  source = "themes/bilberry-hugo-theme/static/theme-exclude-moment-and-highlight.js"
  target = "assets/bilberry/theme-exclude-moment-and-highlight.js"
[[module.mounts]]
  source = "themes/bilberry-hugo-theme/static/theme-exclude-moment.js"
  target = "assets/bilberry/theme-exclude-moment.js"
[[module.mounts]]
  source = "themes/bilberry-hugo-theme/static/theme-exclude-highlight.js"
  target = "assets/bilberry/theme-exclude-highlight.js"
[[module.mounts]]
  source = "themes/bilberry-hugo-theme/static/theme.js"
  target = "assets/bilberry/theme.js"
# Font Awesome's fonts under a path without "@" (WEBS-31): Cloudflare answers
# the theme's /fonts/_vendor/@fortawesome/... with a 307 to the %40 spelling,
# which Chrome loops on, so the icons never loaded. theme-css.html points the
# CSS here. Declaring a static mount drops the default one, so static/ is
# mounted explicitly too.
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "themes/bilberry-hugo-theme/static/fonts/_vendor/@fortawesome/fontawesome-free"
  target = "static/fonts/fa"

# Don't publish raw page-bundle files (multi-MB originals with EXIF). Only
# what a template uses gets published: resized images, the 3000px full-size
# copy (render-image.html), og:image, SVG.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '/posts/**'
