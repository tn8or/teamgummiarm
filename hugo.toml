baseURL = 'https://teamgummiarm.dk/'
locale = 'da'
title = 'Team Gummiarm Racing #393'
theme = 'bilberry-hugo-theme'
defaultContentLanguage = 'da'
enableRobotsTXT = true

[params]
  description = "Classic Superbike Hyggerace"
  author = { name = "Tommy Eriksen", email = "r@teamgummiarm.dk" }
  keywords ="team gummiarm,classic superbike,hyggerace,aprilia rsv mille"

  # Posts per page on the front page (newest first)
  paginate = 7

  subtitle = "Classic Superbike Hyggerace · Aprilia RSV Mille #393"
  customImage = "/images/avatar.png"
  overlayIcon = "fa-home"

  enableMomentJs = true
  showFooter = true
  amountLatestPostsInFooter = 5
  amountCategoriesInFooter = -1
  showArchive = false
  showSocialMedia = true
  socialMediaLinks = [
    { link = "https://instagram.com/teamgummiarm", icon = "fab fa-instagram", rel = "me" },
    { link = "https://facebook.com/teamgummiarm", icon = "fab fa-facebook", rel = "me" },
    { link = "https://youtube.com/@teamgummiarm", icon = "fab fa-youtube", rel = "me" },
    { link = "mailto:r@teamgummiarm.dk", icon = "fas fa-envelope" },
  ]
  copyrightBy = "Tommy Eriksen"
  copyrightUseCurrentYear = false
  copyrightYearOverride = "2026"
  copyrightUrl = "https://teamgummiarm.dk"
  creditsText = "Bilberry Hugo Theme"
  creditsUrl = "https://github.com/Lednerb/bilberry-hugo-theme"

[taxonomies]
  author   = "author"
  tag      = "tags"
  category = "categories"
  series   = "series"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Markdown copy of every page (index.md next to index.html). nginx serves it
# instead of the HTML when a client sends Accept: text/markdown.
[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["html", "rss", "markdown"]
  section = ["html", "rss", "markdown"]
  page = ["html", "markdown"]
